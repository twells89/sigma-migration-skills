            plugins/looker-to-sigma/skills/looker-to-sigma/tests/test_grounding.py
            plugins/looker-to-sigma/skills/looker-to-sigma/tests/test_metric_reference.py
            shared/lib/test_metric_binding.py
            plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test_sigma_rest.py
            plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test_tableau_rest.py
            plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test_pick_destination.py
            plugins/looker-to-sigma/skills/looker-to-sigma/scripts/test_scout_ledger_integrity.py
            plugins/microstrategy-to-sigma/skills/microstrategy-to-sigma/scripts/test_scout_ledger_integrity.py
            plugins/thoughtspot-to-sigma/skills/thoughtspot-to-sigma/scripts/test_scout_ledger_integrity.py
            plugins/qlik-to-sigma/skills/qlik-to-sigma/tests/test_metric_reference.py
            plugins/gooddata-to-sigma/skills/gooddata-to-sigma/tests/test_metric_reference.py
            plugins/microstrategy-to-sigma/skills/microstrategy-to-sigma/tests/test_metric_reference.py
            plugins/thoughtspot-to-sigma/skills/thoughtspot-to-sigma/tests/test_metric_reference.py
