            plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test-sql-ident-check.rb
            plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test-dm-quarantine.rb
            plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test-cred-gate.rb
            plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test-validate-spec-guards.rb
            plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test-zip-extract.rb
            plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test-py-resolve-winpath.rb
            plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test-rank-connections.rb
            plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test-fast-flag.rb
            plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test-bootstrap.rb
            plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test-intake.rb
            plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test-skill-coverage.rb
            plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test-preflight-lint.rb
            plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test-control-field-census.rb
            plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test-number-range-filter-emission.rb
