# Corpus regression check + repo-wide script syntax CI (bead x30b).
#
# Both jobs are CREDS-FREE by design: run-corpus.sh --check is pure
# stdlib-python3 + bash (PyYAML optional — corpus_check.py has a structural
# fallback), and the syntax job only parses files. No secrets are used or
# needed anywhere in this workflow — keep it that way.
#
# Runner deps (verified): ubuntu-24.04 ships python3 (3.12), ruby and bash
# preinstalled. Pinned to ubuntu-24.04 (not -latest) so a runner-image
# rollover can't silently change the interpreters — but note that pinning the
# IMAGE does not pin the image's Ruby: ubuntu-24.04 image 20260816.277.1
# shipped a Ruby whose bundled json gem is >= 2.8, which pretty-prints empty
# containers as `[]` instead of the historical `[\n\n]`. Every byte-compared
# corpus golden was generated with the older form, so the `corpus` job pins
# Ruby explicitly via setup-ruby. The pin is deliberately NOT applied to the
# test-*.rb jobs: those run fine on whatever Ruby the image ships, and
# setup-ruby's Ruby lacks gems the distro build bundles (webrick, which
# test-put-layout-prune.rb requires). Whole workflow budget: < 2 minutes
# (locally ~1 s + ~5 s).
name: corpus-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  corpus:
    name: corpus --check (creds-free goldens)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Same pin, same reason as ruby-full-suite and the BSD-smoke job below:
      # UTF-8-heavy fixtures crash under a US-ASCII default external encoding
      # (F5 crash class). This job was the one that did NOT pin it, which is how
      # tableau/preagg-kpi could pass in CI and fail on an unset-LANG laptop
      # (issue #752). run-corpus.sh self-pins as well, which covers a developer
      # running it directly; this job-level pin covers the OTHER steps here and
      # means the runner's default locale is never something we rely on.
      # (Running a single case's `bash checks.sh` by hand still needs a UTF-8
      # locale in your own shell -- its inline `ruby -e` assertions cannot
      # self-pin. corpus/README.md says so.)
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        # Pin Ruby (same version the windows-smoke job already pins) so the
        # bundled json gem keeps the empty-container pretty-print form the
        # goldens were generated with. Without this, a runner-image Ruby bump
        # fails every `cmp` golden as an opaque byte offset.
        with:
          ruby-version: '3.3'
      - name: Install offline image-analysis dependencies
        run: python3 -m pip install --quiet pillow numpy
      - name: Validate every corpus case against its golden
        run: ./corpus/run-corpus.sh --check
      - name: Converter-default regression (issue #227 — vendored default, no silent dev-checkout)
        # Creds-free, network-free: proves each orchestrator defaults to the pinned
        # vendored bundle and only uses a local build via an explicit env/flag.
        run: ./corpus/converter-default-test.sh

  ruby-free-runtime:
    name: Tableau Python runtime (Ruby absent)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    container:
      image: node:22-bookworm
    env:
      SIGMA_CLIENT_ID: ci-offline-placeholder
      SIGMA_CLIENT_SECRET: ci-offline-placeholder
      SIGMA_BASE_URL: https://aws-api.[REDACTED].com
      SIGMA_SKIP_CRED_SMOKE: "1"
      SIGMA_SKIP_VERSION_CHECK: "1"
    steps:
      - name: Install Python-only runtime prerequisites
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 git curl ca-certificates
          if command -v ruby >/dev/null 2>&1; then
            echo "::error::Ruby must be absent from the ruby-free-runtime job"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Verify profile, doctor, discovery, and converter paths without Ruby
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 shared/scripts/test_runtime_profile.py
          bash plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test-doctor-json.sh
          python3 plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test_assert_doctor_ran.py
          python3 plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test_tableau_rest.py
          python3 plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test_tableau_discover.py
          python3 plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test_convert_tableau.py
          python3 plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test_repair_date_role.py
          python3 plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test_post_and_readback.py
          python3 plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test_build_workbook_template.py
          python3 plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test_verify_parity.py
          python3 plugins/tableau-to-sigma/skills/tableau-to-sigma/scripts/test_verify_complete.py
          python3 tools/check-shared.py

  windows-smoke:
    name: windows PowerShell path (doctor.ps1 + offline corpus)
    # Proves the Windows/PowerShell path works BEFORE an event does (P0.4):
    # doctor.ps1 runs, emits a valid + passing doctor.json, and the offline
    # local-converter corpus converts. No real secrets, network-free. Runtimes
    # are pinned via setup-* so a runner-image change can't flip doctor's result.
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      TS_SKILL: plugins/tableau-to-sigma/skills/tableau-to-sigma
      # CI is a shallow checkout — the version-drift probe is meaningless here and
      # rev-list against a grafted origin/main is unreliable. Skip it explicitly
      # (the doctors also auto-skip on a shallow clone).
      SIGMA_SKIP_VERSION_CHECK: "1"
      # doctor.ps1/.sh are fail-closed on ABSENT Sigma creds (a real run would
      # die at its first API call — an intentional gate). This job only proves
      # the Windows/PowerShell path works; it holds no secrets and makes no
      # network calls. Satisfy the cred-PRESENCE check with placeholders and
      # skip the live token-mint smoke — no real credential is used and nothing
      # leaves the runner. (The bash offline jobs don't gate on the doctor.)
      SIGMA_CLIENT_ID: ci-offline-placeholder
      SIGMA_CLIENT_SECRET: ci-offline-placeholder
      SIGMA_BASE_URL: https://aws-api.sigmacomputing.com
      SIGMA_SKIP_CRED_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline image-analysis dependencies
        run: python -m pip install --quiet pillow numpy
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: bootstrap.ps1 no-ops into doctor-green + sentinel (PR-15)
        shell: pwsh
        run: |
          $wd = Join-Path $env:RUNNER_TEMP 'wd'
          New-Item -ItemType Directory -Force -Path $wd | Out-Null
          # Full bootstrap on a complete runner: verifies runtimes, pip-installs
          # the render deps if absent, persists the placeholder creds via
          # setup.rb --from-env, ends in a doctor run + writes the sentinel.
          powershell -ExecutionPolicy Bypass -File "$env:TS_SKILL\scripts\bootstrap.ps1" -WorkDir $wd
          if ($LASTEXITCODE -ne 0) { throw "bootstrap.ps1 exited $LASTEXITCODE" }
          $j = Get-Content (Join-Path $wd 'doctor.json') -Raw | ConvertFrom-Json
          Write-Host "doctor.json -> os=$($j.os) shell=$($j.shell) pass=$($j.pass)"
          if (-not $j.pass) { throw "doctor.json pass=false: $($j.failures -join '; ')" }
          foreach ($r in 'ruby','python','node') {
            if (-not $j.runtimes.$r) { throw "doctor.json runtimes.$r is false" }
          }
          $s = Get-Content (Join-Path $wd 'bootstrap.json') -Raw | ConvertFrom-Json
          if (-not $s.doctor_pass) { throw "bootstrap sentinel doctor_pass=false" }
          # Idempotency + dry-run: a complete env must report nothing to install.
          powershell -ExecutionPolicy Bypass -File "$env:TS_SKILL\scripts\bootstrap.ps1" -Check
          if ($LASTEXITCODE -ne 0) { throw "bootstrap.ps1 -Check exited $LASTEXITCODE on a complete env" }

      - name: get_token.py imports + parses under Windows Python
        shell: pwsh
        run: |
          python "$env:TS_SKILL\scripts\get_token.py" --help
          if ($LASTEXITCODE -ne 0) { throw "get_token.py --help exited $LASTEXITCODE" }

      - name: assert-doctor-ran gate passes on the emitted doctor.json
        shell: pwsh
        run: |
          $wd = Join-Path $env:RUNNER_TEMP 'wd'
          ruby "$env:TS_SKILL\scripts\assert-doctor-ran.rb" --workdir $wd
          if ($LASTEXITCODE -ne 0) { throw "assert-doctor-ran gate failed on a passing doctor.json" }

      - name: offline corpus conversion (local converter) under Git Bash
        shell: bash
        run: |
          # Proves the offline local-converter path converts on Windows.
          # (converter-default-test.sh is NOT run here — its dev-override path
          # assertions compare Unix-style paths and don't port to Windows drive
          # letters / backslashes; it runs on the ubuntu 'corpus' job instead.)
          ./corpus/run-corpus.sh --check

  script-syntax:
    name: syntax-check every script (ruby -c / py_compile / bash -n)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse every tracked .rb / .py / .sh file
        # Cheap repo-wide syntax CI: a script that doesn't even parse must
        # never reach main. Shebang-aware for .sh files because a few scripts
        # carry a .sh name with a ruby shebang (e.g. setup-tableau.sh).
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r f; do
            ruby -c "$f" >/dev/null || { echo "::error file=$f::ruby syntax error"; fail=1; }
          done < <(git ls-files '*.rb')
          while IFS= read -r f; do
            python3 -m py_compile "$f" || { echo "::error file=$f::python syntax error"; fail=1; }
          done < <(git ls-files '*.py')
          while IFS= read -r f; do
            shebang=$(head -1 "$f")
            case "$shebang" in
              *ruby*)   ruby -c "$f" >/dev/null || { echo "::error file=$f::ruby syntax error"; fail=1; } ;;
              *python*) python3 -m py_compile "$f" || { echo "::error file=$f::python syntax error"; fail=1; } ;;
              *)        bash -n "$f" || { echo "::error file=$f::bash syntax error"; fail=1; } ;;
            esac
          done < <(git ls-files '*.sh')
          echo "checked: $(git ls-files '*.rb' | wc -l) rb, $(git ls-files '*.py' | wc -l) py, $(git ls-files '*.sh' | wc -l) sh"
          exit $fail
      - name: Parse every tracked .ps1 file (pwsh AST, parse-only)
        # The bootstrap.ps1/doctor.ps1 twins ship to every Windows user, but
        # only the tableau doctor.ps1 is ever RUN in CI (windows-smoke) — a
        # non-parsing .ps1 twin anywhere else would reach main unnoticed.
        # Ubuntu runners ship pwsh; nothing is executed, only parsed.
        shell: pwsh
        run: |
          $failed = 0
          $files = @(git ls-files '*.ps1')
          foreach ($f in $files) {
            $tokens = $null; $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $f), [ref]$tokens, [ref]$errs) | Out-Null
            if ($errs -and $errs.Count -gt 0) {
              Write-Output "::error file=$f::powershell parse error: $($errs[0].Message)"
              $failed = 1
            }
          }
          Write-Output "checked: $($files.Count) ps1"
          exit $failed

  shared-libs:
    name: shared-lib drift gate (canonical == every vendored copy)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assert no vendored shared file has drifted from its canonical
        # Vendored shared infra (lib/sigma_rest.rb, the lints, escalate-gap.py,
        # etc.) must stay byte-identical to shared/. Edit the canonical copy,
        # run tools/sync-shared.rb, commit the fan-out. Intentional forks are
        # allowlisted in shared/manifest.json. Creds-free, stdlib ruby only.
        run: ruby tools/check-shared.rb

  skill-lint:
    name: skill conformance (mandatory gates documented)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint every converter SKILL.md for the mandatory arc gates
        # Each converter must document the C3 reuse / C5 readback / C7 layout /
        # C8 parity / C9 RLS gates and appear in docs/phase-schema.md. Known
        # gaps are tracked in tools/skill-lint-baseline.json (WARN, not fail).
        run: ruby tools/lint-skills.rb
      - name: Lint ESM converter imports for the Windows file:// footgun (#348)
        # A shim importing the converter by bare absolute path throws
        # ERR_UNSUPPORTED_ESM_URL_SCHEME on Windows (latent on macOS). Require a
        # pathToFileURL / Gem.win_platform?+file:/// / Path.as_uri() guard.
        run: ruby tools/lint-esm-imports.rb
      - name: Check agent variants are in sync with SKILL.md
        # The Cursor/Codex/Cline/Continue instruction files are generated from
        # each skill's SKILL.md by tools/gen-agent-variants.rb. Fail if a
        # committed variant drifted, so EVERY coding agent reads the same steps.
        run: ruby tools/check-agent-variants.rb
      - name: Lint skill paths for marketplace-unsafe / stale refs
        # Ban legacy sigma-skills/ paths and deep ../../../../docs/ relatives that
        # break when a plugin is installed alone. See docs/agent-entry.md.
        run: |
          ruby tools/lint-skill-paths.rb
          bash tools/test-lint-skill-paths.sh
      - name: new-skill.rb registry stamp self-test
        # Scaffolds a throwaway plugin, asserts marketplace/AGENTS/plugin.json
        # were stamped, then deletes it. Creds-free.
        run: bash tools/test-new-skill-registry.sh
      - name: Cognos vendored bundle is fresh vs converter/*.ts
        # cognos ships its converter as in-skill TS bundled into converter/cli.mjs
        # (production runs the bundle). Fail if a converter/*.ts edit shipped without
        # re-running tools/vendor-converters.sh — a stale bundle silently ships the OLD
        # behavior. Source-hash gate (not a flaky byte compare); mirrors check-shared.
        run: ruby tools/check-cognos-bundle.rb

  unit-tests:
    name: offline unit/regression tests (creds-free)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate sigma-workbooks formula and control contracts
        run: bash plugins/sigma-authoring/skills/sigma-workbooks/scripts/test-validate-spec-contract.sh
      - name: Run offline test-*.rb suites
        # EXPLICIT allow-list — only tests that need NO Tableau/Sigma creds or
        # network. Do NOT add test-calc-discovery.rb (needs a Tableau token);
        # keep this workflow creds-free. New offline test-*.rb → add its path
